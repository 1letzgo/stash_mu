name: Multi-user Docker image

# Builds the Docker image of the multi-user fork and pushes it to
# ghcr.io/<owner>/stash:multi-user (plus a tag per commit).

on:
  push:
    branches: [feature/multi-user]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/stash" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build/x86_64/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GITHASH=${{ steps.meta.outputs.sha }}
            STASH_VERSION=multi-user-${{ steps.meta.outputs.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:multi-user
            ${{ steps.meta.outputs.image }}:multi-user-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
